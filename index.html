                num: 13,
                tamil: `ஸம்பத்கராணி ஸகலேந்த்ரிய நந்தனாநி\nஸாம்ராஜ்ய தான விபவானி ஸரோருஹா |\nத்வத்வந்தனாநி துரிதாஹரணோத்யதாநி\nமாமேவ மாதரநிசம் கலயந்து மான்யே ||`,
                meaning: `ஹே! தாமரைபோல் கண்களை உடையவளே! செல்வம் கொழிப்பனவும், கரணங்களனைத்தையும் மகிழ்விப்பனவும், சக்ரவர்த்தி பதவியை நல்குவனவும், பாபங்களைப் போக்குபவனவுமான உன்னை வணங்கல்கள் என்னையே சாரட்டும்.`
            },
            {
                num: 14,
                tamil: `யத்கடாக்ஷஸமுபாஸனாவிதி:\nஸேவகஸ்ய ஸகலார்த்தஸம்பத: |\nஸந்தநோதி வசனாங்க மானஸை:\nத்வாம் முராரிஹ்ருதயேச்வரீம் பஜே ||`,
                meaning: `எந்த அம்பிகையின் வழிபாடு, வழிபடுபவனுக்கு எல்லா வித செல்வங்களையும் நல்குமோ, அந்த விஷ்ணு பத்னியை முக்கரணங்களாலும் சேவிக்கிறேன்.`
            },
            {
                num: 15,
                tamil: `ஸரஸிஜநிலயே ஸரோஜ ஹஸ்தே\nதவல தமாம்சுக கந்த மால்யசோபே |\nபகவதி ஹரிவல்லபே மனோஜ்ஞே\nத்ரிபுவன பூதிகரி ப்ரஸீத மஹ்யம் ||`,
                meaning: `தாமரைமலரில் வீற்றிருப்பவளே! கையில் தாமரையை கொண்டவளே! மிக வெண்மையான துகில், சந்தனம் மாலை இவற்றால் அழகியவளே! இனியவளே, மதிப்பிற்குரிய ஹரிப்ரியே! மூவுலகிற்கும் ஐச்வர்யம் நல்குபவளே எனக்கு மனமுவந்து அருள்வாயாக!`
            },
            {
                num: 16,
                tamil: `திக்ஹஸ்திபி: கனக கும்ப முகாவஸ்ருஷ்ட\nஸ்வர்வாஹினீ விமல சாரு ஜலுப்லுதாங்கீம் |\nப்ராதர்நமாமி ஜகதாம் ஜனனீமசேஷ\nலோகாதிநாத க்ருஹீணீ மம்ருதாப்திபுத்ரீம் ||`,
                meaning: `திக்கஜங்கள், தங்கக்குடங்களின் வழியே பெருகச்செய்த ஆகாசகங்கை நீரால் நனைந்த உடலையுடையவளும், உலகனைத்திற்கும் தாய் ஆனவளும், உலக நாயகரான விஷ்ணு ப்ரியையானவளும், பாற்கடல் பெண்ணுமாகிய லக்ஷ்மி தேவியை வணங்குகிறேன்.`
            },
            {
                num: 17,
                tamil: `கமலே கமலாக்ஷ வல்லபே த்வம்\nகருணா பூரதரங்கிதை ரபாங்கை: |\nஅவலோகய மாமகிஞ்சனானாம்\nப்ரதமம் பாத்ரமக்ருத்ரிமம் தயாயா: ||`,
                meaning: `மஹாலக்ஷ்மி! மஹாவிஷ்ணுவின் பிரியே! நீ கருணை ததும்பும் கடாக்ஷங்களால், மிக ஏழையானவர்களுக்கு இரக்கம் காட்டவேண்டிய முதல் நபரான என் மேல் பார்த்தருள்வாயாக !`
            },
            {
                num: 18,
                tamil: `ஸ்துவந்த யே ஸ்துதிபிரமூபிரன்வஹம்\nத்ரயீமயீம் த்ரிபுவன மாதரம் ரமாம் |\nகுணாதிகா குருதர பாக்ய பாஜினோ\nபவந்தி தே புவி புதபாவிதாசாய: ||`,
                meaning: `மூன்று வேதங்களே உருவான த்ரிலோகமாதாவும் லக்ஷ்மிதேவியை இந்த ஸ்தோத்திரங்களால் தினந்தோறும் ஸ்தோத்ரம் செய்பவர் குணம் மிக்கவராயும், மிகப்பெரிய பேறு பெற்றவராயும், அறிஞர் போற்றும் கருத்து கொண்டவராயும் ஆவர்.`
            }
        ];

        let currentIndex = 0;
        let autoPlayInterval = null;

        function displayVerse(index) {
            const verse = verses[index];
            document.getElementById('verse-num').textContent = verse.num;
            document.getElementById('verse-title').textContent = `ஸ்லோகம் ${verse.num}`;
            document.getElementById('tamil-text').innerHTML = verse.tamil.replace(/\n/g, '<br>');
            document.getElementById('meaning-text').innerHTML = verse.meaning;
            currentIndex = index;
        }

        function nextVerse() {
            currentIndex = (currentIndex + 1) % verses.length;
            displayVerse(currentIndex);
        }

        function prevVerse() {
            currentIndex = (currentIndex - 1 + verses.length) % verses.length;
            displayVerse(currentIndex);
        }

        function toggleAutoPlay() {
            if (autoPlayInterval) {
                clearInterval(autoPlayInterval);
                autoPlayInterval = null;
            } else {
                autoPlayInterval = setInterval(nextVerse, 8500);
            }
        }

        function copyVerse() {
            const verse = verses[currentIndex];
            const text = `கனகதாரா ஸ்தோத்ரம் - ஸ்லோகம் ${verse.num}\n\n${verse.tamil}\n\n${verse.meaning}`;
            navigator.clipboard.writeText(text);
            alert('✅ ஸ்லோகம் + பொருள் நகல் செய்யப்பட்டது!');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === "ArrowRight") nextVerse();
            if (e.key === "ArrowLeft") prevVerse();
        });

        window.onload = () => displayVerse(0);
    </script>
</body>
</html>
